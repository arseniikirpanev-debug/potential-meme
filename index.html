<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amogus 2D - Одиночная Игра</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0c0f12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            height: 100%;
        }
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        /* Интерфейс управления */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-panel {
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
            align-self: flex-start;
            line-height: 1.5;
        }
        #action-buttons {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .game-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            color: white;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            opacity: 0.4;
        }
        .game-btn:active {
            transform: scale(0.9);
        }
        /* Стили состояний кнопок */
        .game-btn.active-kill {
            opacity: 1.0;
            background: #e74c3c;
            border-color: #ff9f43;
        }
        .game-btn.active-sabotage {
            opacity: 1.0;
            background: #9b59b6;
            border-color: #a29bfe;
        }
        #joystick-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #joystick-handle {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div class="hud-panel" id="status-panel">
                Ваша роль: <span style="color: #e74c3c;">ПРЕДАТЕЛЬ</span><br>
                Осталось ботов: <span id="bots-count" style="color: #3498db;">5</span><br>
                Починено саботажей: <span id="sabotage-count" style="color: #2ecc71;">0/3</span><br>
                <span id="game-alert" style="color: #f1c40f; display:block; margin-top:5px;">Статус: Все спокойно</span>
            </div>
            
            <div id="joystick-zone">
                <div id="joystick-handle"></div>
            </div>

            <div id="action-buttons">
                <button class="game-btn" id="sabotage-btn">Саботаж</button>
                <button class="game-btn" id="kill-btn">Убить</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Разрешение экрана и размеры карты
        const VIRTUAL_WIDTH = 1280;
        const VIRTUAL_HEIGHT = 720;
        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 2000;

        // Данные игрока (Предатель)
        const player = {
            x: MAP_WIDTH / 2,
            y: MAP_HEIGHT / 2,
            radius: 22,
            speed: 320,
            vx: 0, vy: 0,
            color: '#e74c3c' // Красный
        };

        // Состояние игры
        let gameActive = true;
        let activeSabotage = false;
        let repairedSabotages = 0;
        const requiredSabotagesToWin = 3;
        let sabotageTimer = 0; // Время, нужное боту для починки

        // Точки интереса на карте (Генератор для починки и две точки заданий)
        const targets = {
            generator: { x: 400, y: 400, radius: 45, color: '#9b59b6', name: 'Генератор (Саботаж)' },
            taskA: { x: 1600, y: 400, radius: 35, color: '#f1c40f', name: 'Проводка (Задание)' },
            taskB: { x: 1000, y: 1600, radius: 35, color: '#f1c40f', name: 'Сканер (Задание)' }
        };

        // Твердые стены на карте
        const walls = [
            { x: 600, y: 300, width: 40, height: 500 },
            { x: 1200, y: 1000, width: 500, height: 40 },
            { x: 800, y: 800, width: 300, height: 300 }
        ];

        // Массив цветов для разнообразия ботов
        const botColors = ['#3498db', '#2ecc71', '#f39c12', '#1abc9c', '#95a5a6'];
        const bots = [];

        // Спавним 5 ботов-мирных в случайных местах
        for (let i = 0; i < 5; i++) {
            bots.push({
                id: i,
                x: 200 + Math.random() * 1500,
                y: 200 + Math.random() * 1500,
                radius: 22,
                speed: 160, // Боты ходят чуть медленнее игрока
                color: botColors[i],
                isAlive: true,
                targetPoint: null, // Куда сейчас идет бот
                state: 'WANDERING' // Состояния: WANDERING (гуляет), SABOTAGE (бежит чинить)
            });
        }
              // Настройки джойстика для мобильных устройств
        const joystickZone = document.getElementById('joystick-zone');
        const joystickHandle = document.getElementById('joystick-handle');
        let joystickInput = { x: 0, y: 0 };
        let isJoystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        const maxJoystickRadius = 45;

        // Клавиатура для ПК
        const keys = { w: false, a: false, s: false, d: false };

        // Ресайз игрового холста
        function resizeGame() {
            const scale = Math.min(window.innerWidth / VIRTUAL_WIDTH, window.innerHeight / VIRTUAL_HEIGHT);
            canvas.width = VIRTUAL_WIDTH * scale;
            canvas.height = VIRTUAL_HEIGHT * scale;
            ctx.scale(scale, scale);
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // Слушатели событий сенсорного экрана (джойстик)
        joystickZone.addEventListener('pointerdown', (e) => {
            isJoystickActive = true;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width / 2;
            joystickCenter.y = rect.top + rect.height / 2;
            updateJoystick(e);
        });

        window.addEventListener('pointermove', (e) => {
            if (!isJoystickActive) return;
            updateJoystick(e);
        });

        window.addEventListener('pointerup', () => {
            isJoystickActive = false;
            joystickInput.x = 0; joystickInput.y = 0;
            joystickHandle.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(e) {
            let dx = e.clientX - joystickCenter.x;
            let dy = e.clientY - joystickCenter.y;
            const distance = Math.hypot(dx, dy);

            if (distance > maxJoystickRadius) {
                dx = (dx / distance) * maxJoystickRadius;
                dy = (dy / distance) * maxJoystickRadius;
            }

            joystickHandle.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickInput.x = dx / maxJoystickRadius;
            joystickInput.y = dy / maxJoystickRadius;
        }

        // Слушатели клавиатуры
        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

        // Проверка столкновения объекта (круг) со всеми стенами (AABB)
        function checkWallCollision(cx, cy, radius) {
            for (let wall of walls) {
                let closestX = Math.max(wall.x, Math.min(cx, wall.x + wall.width));
                let closestY = Math.max(wall.y, Math.min(cy, wall.y + wall.height));
                let distance = Math.hypot(cx - closestX, cy - closestY);
                if (distance < radius) return true;
            }
            return false;
        }

        // Искусственный интеллект ботов
        function updateBotsAI(dt) {
            bots.forEach(bot => {
                if (!bot.isAlive) return;

                // Переключение поведения при саботаже
                if (activeSabotage && bot.state !== 'SABOTAGE') {
                    bot.state = 'SABOTAGE';
                    bot.targetPoint = { x: targets.generator.x, y: targets.generator.y };
                } else if (!activeSabotage && bot.state === 'SABOTAGE') {
                    bot.state = 'WANDERING';
                    bot.targetPoint = null;
                }

                // Если у бота нет цели, выбираем случайное задание
                if (!bot.targetPoint) {
                    const choice = Math.random() > 0.5 ? targets.taskA : targets.taskB;
                    bot.targetPoint = { x: choice.x + (Math.random() * 40 - 20), y: choice.y + (Math.random() * 40 - 20) };
                }

                // Вычисляем вектор движения к цели
                let dx = bot.targetPoint.x - bot.x;
                let dy = bot.targetPoint.y - bot.y;
                const distance = Math.hypot(dx, dy);

                if (distance > 15) {
                    // Идем к цели
                    let vx = (dx / distance) * bot.speed;
                    let vy = (dy / distance) * bot.speed;

                    // Плавный обход стен (примитивный стрейф)
                    let nextX = bot.x + vx * dt;
                    if (!checkWallCollision(nextX, bot.y, bot.radius)) {
                        bot.x = nextX;
                    } else {
                        bot.y += (vy > 0 ? 1 : -1) * bot.speed * 0.5 * dt; // скользим вертикально
                    }

                    let nextY = bot.y + vy * dt;
                    if (!checkWallCollision(bot.x, nextY, bot.radius)) {
                        bot.y = nextY;
                    } else {
                        bot.x += (vx > 0 ? 1 : -1) * bot.speed * 0.5 * dt; // скользим горизонтально
                    }
                } else {
                    // Если пришли в точку саботажа, запускаем процесс починки генератора
                    if (bot.state === 'SABOTAGE') {
                        sabotageTimer += dt;
                        document.getElementById('game-alert').innerText = 'Статус: Боты чинят генератор!';
                        if (sabotageTimer >= 3.0) { // На починку уходит 3 секунды непрерывного нахождения бота у генератора
                            activeSabotage = false;
                            sabotageTimer = 0;
                            repairedSabotages++;
                            document.getElementById('sabotage-count').innerText = `${repairedSabotages}/3`;
                            document.getElementById('game-alert').innerText = 'Статус: Саботаж ликвидирован!';
                            checkGameEnd();
                        }
                    } else {
                        // Если пришел на обычное задание, постоим немного и выберем новую цель
                        bot.targetPoint = null;
                    }
                }
            });
        }
              // Кнопки интерфейса
        const btnKill = document.getElementById('kill-btn');
        const btnSabotage = document.getElementById('sabotage-btn');
        let closestBot = null;

        // Поиск ближайшего живого бота и активация кнопок
        function evaluateInteractions() {
            if (!gameActive) return;
            
            closestBot = null;
            let minDistance = Infinity;

            bots.forEach(bot => {
                if (!bot.isAlive) return;
                const dist = Math.hypot(player.x - bot.x, player.y - bot.y);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestBot = bot;
                }
            });

            // Активация кнопки УБИТЬ при дистанции меньше 70px
            if (closestBot && minDistance < 70) {
                btnKill.classList.add('active-kill');
            } else {
                btnKill.classList.remove('active-kill');
                closestBot = null;
            }

            // Активация кнопки САБОТАЖ, если он еще не идет
            if (!activeSabotage) {
                btnSabotage.classList.add('active-sabotage');
            } else {
                btnSabotage.classList.remove('active-sabotage');
            }
        }

        // Действие при клике на убийство
        btnKill.addEventListener('pointerdown', () => {
            if (closestBot && gameActive) {
                closestBot.isAlive = false;
                closestBot.state = 'DEAD';
                const aliveCount = bots.filter(b => b.isAlive).length;
                document.getElementById('bots-count').innerText = aliveCount;
                document.getElementById('game-alert').innerText = 'Статус: Мирный устранен!';
                checkGameEnd();
            }
        });

        // Действие при клике на саботаж
        btnSabotage.addEventListener('pointerdown', () => {
            if (!activeSabotage && gameActive) {
                activeSabotage = true;
                sabotageTimer = 0;
                document.getElementById('game-alert').innerText = 'Статус: САБОТАЖ! Боты бегут к генератору!';
            }
        });

        // Проверка условий победы или поражения
        function checkGameEnd() {
            const aliveBots = bots.filter(b => b.isAlive).length;

            if (aliveBots === 0) {
                gameActive = false;
                document.getElementById('game-alert').innerText = 'ПОБЕДА! Вы устранили весь экипаж!';
                document.getElementById('game-alert').style.color = '#2ecc71';
            } else if (repairedSabotages >= requiredSabotagesToWin) {
                gameActive = false;
                document.getElementById('game-alert').innerText = 'ПОРАЖЕНИЕ! Экипаж восстановил генераторы!';
                document.getElementById('game-alert').style.color = '#e74c3c';
            }
        }

        // Основной цикл отрисовки и обновления 60 FPS
        let lastTime = performance.now();

        function gameLoop(now) {
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (gameActive) {
                // Движение игрока
                let moveX = 0; let moveY = 0;
                if (isJoystickActive) {
                    moveX = joystickInput.x; moveY = joystickInput.y;
                } else {
                    if (keys.w) moveY = -1; if (keys.s) moveY = 1;
                    if (keys.a) moveX = -1; if (keys.d) moveX = 1;
                    const len = Math.hypot(moveX, moveY);
                    if (len > 0) { moveX /= len; moveY /= len; }
                }

                player.vx = moveX * player.speed;
                player.vy = moveY * player.speed;

                let nextX = player.x + player.vx * dt;
                if (nextX > player.radius && nextX < MAP_WIDTH - player.radius && !checkWallCollision(nextX, player.y, player.radius)) {
                    player.x = nextX;
                }
                let nextY = player.y + player.vy * dt;
                if (nextY > player.radius && nextY < MAP_HEIGHT - player.radius && !checkWallCollision(player.x, nextY, player.radius)) {
                    player.y = nextY;
                }

                updateBotsAI(dt);
                evaluateInteractions();
            }

            // Очистка экрана и настройка камеры по центру игрока
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
            const camX = VIRTUAL_WIDTH / 2 - player.x;
            const camY = VIRTUAL_HEIGHT / 2 - player.y;

            ctx.save();
            ctx.translate(camX, camY);

            // Отрисовка фона (космический пол)
            ctx.fillStyle = '#161d24';
            ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
            ctx.strokeStyle = '#232d38';
            ctx.lineWidth = 2;
            for (let x = 0; x <= MAP_WIDTH; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= MAP_HEIGHT; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_WIDTH, y); ctx.stroke();
            }

            // Отрисовка зон интерактива
            for (let key in targets) {
                let t = targets[key];
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                
                // Текст над зоной
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
                ctx.fillText(t.name, t.x, t.y - t.radius - 10);
            }

            // Отрисовка стен
            ctx.fillStyle = '#57606f';
            walls.forEach(wall => {
                ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
                ctx.lineWidth = 3; ctx.strokeStyle = '#2f3542'; ctx.strokeRect(wall.x, wall.y, wall.width, wall.height);
            });

            // Отрисовка ботов
            bots.forEach(bot => {
                if (!bot.isAlive) return; // Мертвых ботов просто скрываем
                ctx.fillStyle = bot.color;
                ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

                // Иллюминатор для бота
                ctx.fillStyle = '#dff9fb';
                ctx.beginPath(); ctx.ellipse(bot.x + 8, bot.y - 4, 9, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            });

            // Отрисовка игрока (Предатель)
            ctx.fillStyle = player.color;
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();

            // Иллюминатор игрока
            ctx.fillStyle = '#dff9fb';
            ctx.beginPath(); ctx.ellipse(player.x + 8, player.y - 4, 9, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            ctx.restore();

            // Отрисовка виртуального мобильного джойстика
            if (isJoystickActive) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath(); ctx.arc(joystickCenter.x * (VIRTUAL_WIDTH / canvas.width), joystickCenter.y * (VIRTUAL_HEIGHT / canvas.height), maxJoystickRadius, 0, Math.PI * 2); ctx.fill();
            }

            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
